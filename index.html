<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Propuestas de Diseño Web — Yolanda María Verbauwede</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1E293B;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #F8FAFC;
      overflow: hidden;
    }

    .toolbar {
      height: 50px;
      background-color: #0F172A;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .options-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      min-width: 0;
    }

    .options-strip::-webkit-scrollbar {
      display: none;
    }

    .label {
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      margin-right: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tool-btn {
      appearance: none;
      background-color: rgba(255, 255, 255, 0.06);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .tool-btn:hover {
      background-color: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    .tool-btn.is-active {
      background-color: #C86D51;
      border-color: #C86D51;
      color: #FFFFFF;
    }

    .nav-actions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .arrow-btn {
      appearance: none;
      background-color: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .arrow-btn:hover {
      background-color: rgba(255, 255, 255, 0.18);
      color: #FFFFFF;
    }

    .open-link {
      appearance: none;
      text-decoration: none;
      background-color: #1B365D;
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .open-link:hover {
      background-color: #2A4D80;
    }

    .stage {
      height: calc(100vh - 50px);
      height: calc(100dvh - 50px);
      width: 100%;
      background-color: #1E293B;
      overflow: hidden;
    }

    iframe#preview {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #FAF8F5;
      transition: opacity 0.22s ease;
    }

    @media (max-width: 560px) {
      .toolbar {
        padding: 0 8px;
        gap: 8px;
      }

      .label {
        display: none;
      }
    }

    @media (max-width: 420px) {
      .tool-btn {
        padding: 5px 9px;
        font-size: 12px;
      }

      .open-link {
        padding: 5px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="options-strip" role="tablist" aria-label="Propuestas de diseño">
      <span class="label">Propuestas:</span>
      <button class="tool-btn is-active" type="button" role="tab" aria-selected="true" data-src="variante-f.html">Espina Lateral</button>
      <button class="tool-btn" type="button" role="tab" aria-selected="false" data-src="variante-d.html">Horizonte Editorial</button>
      <button class="tool-btn" type="button" role="tab" aria-selected="false" data-src="variante-e.html">Manifiesto Documental</button>
      <button class="tool-btn" type="button" role="tab" aria-selected="false" data-src="variante-a.html">Crónica y Cátedra</button>
      <button class="tool-btn" type="button" role="tab" aria-selected="false" data-src="variante-b.html">Retícula Institucional</button>
    </div>

    <div class="nav-actions">
      <button id="prevBtn" class="arrow-btn" type="button" aria-label="Propuesta anterior" title="Propuesta anterior">‹</button>
      <button id="nextBtn" class="arrow-btn" type="button" aria-label="Propuesta siguiente" title="Propuesta siguiente">›</button>
      <a id="openAlone" class="open-link" href="variante-f.html" target="_blank" rel="noopener">Ver sola ↗</a>
    </div>
  </header>

  <main class="stage" id="stage">
    <iframe id="preview" src="variante-f.html" title="Propuestas de diseño — Yolanda María Verbauwede"></iframe>
  </main>

  <script>
    const preview = document.getElementById('preview');
    const openAlone = document.getElementById('openAlone');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const variantBtns = Array.from(document.querySelectorAll('[data-src]'));
    let currentIndex = 0;
    let switchTimer = null;
    let fadeFallbackTimer = null;

    function restorePreviewOpacity() {
      clearTimeout(fadeFallbackTimer);
      preview.style.opacity = '1';
    }

    preview.addEventListener('load', restorePreviewOpacity);

    function activateVariant(index, immediate) {
      if (index < 0 || index >= variantBtns.length) return;
      if (index === currentIndex && !immediate) return;
      currentIndex = index;
      const btn = variantBtns[index];
      const src = btn.dataset.src;

      variantBtns.forEach((b, i) => {
        const active = i === index;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-selected', String(active));
      });

      btn.scrollIntoView({ behavior: immediate ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', '#' + (index + 1));
      }

      if (immediate) {
        preview.src = src;
        openAlone.href = src;
        preview.style.opacity = '1';
        return;
      }

      clearTimeout(switchTimer);
      clearTimeout(fadeFallbackTimer);
      preview.style.opacity = '0.15';
      switchTimer = setTimeout(() => {
        preview.src = src;
        openAlone.href = src;
        fadeFallbackTimer = setTimeout(restorePreviewOpacity, 350);
      }, 140);
    }

    variantBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => activateVariant(idx, false));
    });

    prevBtn.addEventListener('click', () => {
      activateVariant((currentIndex - 1 + variantBtns.length) % variantBtns.length, false);
    });

    nextBtn.addEventListener('click', () => {
      activateVariant((currentIndex + 1) % variantBtns.length, false);
    });

    document.addEventListener('keydown', (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const target = event.target;
      const tag = target && target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable)) {
        return;
      }
      if (event.key >= '1' && event.key <= '5') {
        activateVariant(Number(event.key) - 1, false);
      } else if (event.key === 'ArrowLeft') {
        activateVariant((currentIndex - 1 + variantBtns.length) % variantBtns.length, false);
      } else if (event.key === 'ArrowRight') {
        activateVariant((currentIndex + 1) % variantBtns.length, false);
      }
    });

    if (/^#[1-5]$/.test(window.location.hash)) {
      activateVariant(Number(window.location.hash.slice(1)) - 1, true);
    }
  </script>
</body>
</html>
